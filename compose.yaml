services:
  nsf:
    build: .
    ports: ["127.0.0.1:8787:8787"]
    environment:
      NSF_TOKEN: ${NSF_TOKEN:?Set a random token of at least 24 characters}
    volumes:
      - ./config.docker.json:/app/config.json:ro
      - ${NSF_SOURCE:?Set the absolute allowed source repository path}:/source:ro
      - state:/state
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    mem_limit: 768m
    cpus: 2
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  mcp:
    image: python:3.13-alpine
    profiles: [agent]
    command: ["python", "/client/mcp_adapter.py"]
    stdin_open: true
    environment:
      NSF_URL: http://nsf:8787
      NSF_TOKEN: ${NSF_TOKEN}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes: ["./python:/client:ro"]
    read_only: true
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  state:
